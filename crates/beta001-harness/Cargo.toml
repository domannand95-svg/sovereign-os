[package]
name = "beta001-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sovereign-audit = { version = "0.1.0", path = "../sovereign-audit", features = ["governance-evidence-chain"] }
sovereign-agent-runtime = { version = "0.1.0", path = "../sovereign-agent-runtime" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.49"
blake3 = "1.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
git2 = "0.20"
reqwest = { version = "0.13", features = ["blocking", "json"] }
