[workspace]
resolver = "2"
members = [
    "crates/sovereign-ledger",
    "crates/sovereign-registry",
    "crates/sovereign-core-asm",
    "crates/sovereign-policy",
    "crates/sovereign-engine",
    "crates/sovereign-audit",
    "crates/sovereign-discovery",
    "crates/beta001-harness",
]

[workspace.dependencies]
blake3 = { version = "1.5" }
crc32c = "0.6"
proptest = "1.4"
tokio = { version = "1.35", features = ["sync", "rt"] }
serde = { version = "1.0", features = ["derive"] }